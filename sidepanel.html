<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y2BExt</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body>
    <div class="container">
        <div class="header-row">
            <div>
                <span class="brand-kicker">Y2B RESEARCH</span>
            </div>
            <div class="header-buttons">
                <button id="refresh-btn" class="icon-btn" title="重新整理網址和範圍">↻</button>
                <button id="settings-btn" class="icon-btn" title="設定">⚙️</button>
            </div>
        </div>

        <div class="video-source" aria-labelledby="video-url-label">
            <input type="text" id="video-url" placeholder="貼上或編輯 YouTube 影片網址">
        </div>

        <div class="tab-bar" role="tablist" aria-label="摘要與影片對話">
            <button class="tab-btn is-active" id="tab-summary" type="button" role="tab" aria-selected="true" aria-controls="panel-summary">
                <span class="tab-label">摘要</span>
            </button>
            <button class="tab-btn" id="tab-chat" type="button" role="tab" aria-selected="false" aria-controls="panel-chat">
                <span class="tab-label">對話</span>
            </button>
        </div>

        <div class="tab-panel is-active" id="panel-summary" role="tabpanel" aria-labelledby="tab-summary">
        <section class="summary-card" aria-labelledby="summary-title">
            <form id="analysis-form">
                <div class="form-group">
                    <label for="prompt">摘要 Prompt</label>
                    <textarea id="prompt" rows="10" placeholder="請以條列方式摘要影片內容"></textarea>
                </div>

                <div class="range-summary">
                    <span>分析範圍：</span>
                    <span id="selected-range">00:00 - 00:00</span>
                    <span class="hint">（點右上角⚙️調整）</span>
                </div>

                <div class="token-info">
                    <p>
                        預估 Tokens：<span id="token-count">0</span>
                        ／上限：<span id="token-cap">1,048,576</span>
                    </p>
                    <p id="token-warning" class="warn" style="display:none;">超過上限，請縮短區間或降低 FPS。</p>
                </div>
                <div class="form-group2">
                    <button type="submit" id="submit-btn">產生摘要</button>
                </div>
            </form>

            <div id="result-container">
                <div id="result-display" class="loading">請點擊產生摘要開始分析…</div>
            </div>
        </section>
        </div>

        <div class="tab-panel" id="panel-chat" role="tabpanel" aria-labelledby="tab-chat" hidden>
        <section class="chat-card" id="chat-card" aria-labelledby="chat-title">
            <div class="chat-header">
                <div class="chat-heading">
                    <span class="chat-index-status" id="chat-index-status">尚未建立影片時間索引</span>
                </div>
                <div class="chat-actions">
                    <span class="chat-state-label">Gemini</span>
                    <button class="chat-reset-btn" id="chat-reset-btn" type="button">新對話</button>
                </div>
            </div>

            <div class="chat-stage" id="chat-stage" aria-busy="false">
                <div class="chat-empty" id="chat-empty">
                    <strong>摘要完成後，繼續追問影片</strong>
                </div>
                <div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-label="影片對話內容"></div>
            </div>

            <div class="chat-status-row">
                <div class="chat-status" id="chat-status" role="status" aria-live="polite"></div>
                <div class="chat-error" id="chat-error" role="alert" hidden></div>
            </div>

            <form class="chat-composer" id="chat-form">
                <label class="sr-only" for="chat-input">詢問影片</label>
                <textarea
                    class="chat-input"
                    id="chat-input"
                    rows="2"
                    maxlength="2000"
                    placeholder="問一個關於影片的問題…"
                    autocomplete="off"
                ></textarea>
            </form>
        </section>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content solid-card">
            <div class="modal-header">
                <h2>設定</h2>
                <button id="modal-close" class="icon-btn" title="關閉">✖️</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="api-key">Gemini API Key</label>
                    <input type="password" id="api-key" placeholder="請輸入 API Key">
                </div>

                <div class="form-group">
                    <label for="gemini-model">Gemini Model</label>
                    <input type="text" id="gemini-model" placeholder="請輸入 Model 名稱">
                </div>

                <fieldset>
                    <legend>參數設定</legend>
                    <div class="form-group">
                        <label>分析範圍：<span id="start-label">00:00</span> - <span id="end-label">01:00</span></label>
                        <div class="dual-slider">
                            <div class="range-track" id="range-track"></div>
                            <input type="range" id="range-start" min="0" max="60" value="0" step="1">
                            <input type="range" id="range-end" min="0" max="60" value="60" step="1">
                        </div>
                    </div>
                    <div class="form-group inline">
                        <label for="fps">FPS（可小數）</label>
                        <input type="number" id="fps" value="1" min="0.1" step="0.1">
                    </div>
                    <div class="form-group inline">
                        <label for="media-res">媒體解析度</label>
                        <select id="media-res">
                            <option value="default" selected>預設</option>
                            <option value="low">低</option>
                        </select>
                    </div>
                </fieldset>
            </div>
            <div class="modal-footer">
                <button id="modal-save" class="primary">儲存</button>
                <button id="modal-cancel" class="secondary">取消</button>
            </div>
        </div>
    </div>

    <script src="sidepanel.js"></script>
</body>

</html>
